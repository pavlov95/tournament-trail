services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tournament_trail
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  tournament-trail:
    build:
      context: .
      dockerfile: Dockerfile
    image: tournament-trail:azure
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tournament_trail
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx768m"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      APP_PUBLIC_URL: https://tournamenttrail.duckdns.org
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  tournament-results:
    build:
      context: ../tournament-results-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tournament_results
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tournament-trail
    restart: unless-stopped

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
