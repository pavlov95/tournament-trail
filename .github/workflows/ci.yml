
name: TournamentTrail CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode clean verify


  deploy:
    name: Deploy to Azure
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: tournamenttrail-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure VM
        shell: bash
        run: |
          set -euo pipefail

          az vm run-command invoke \
            --resource-group rg-tournament-trail \
            --name vm-tournament-trail \
            --command-id RunShellScript \
            --scripts @.github/scripts/deploy-azure.sh \
            --query "value[].message" \
            --output tsv | tee deployment.log

          grep -q "DEPLOYMENT_OK" deployment.log

