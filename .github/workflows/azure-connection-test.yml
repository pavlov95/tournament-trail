name: Test Azure Connection

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-azure:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure VM access
        run: |
          az vm show \
            --resource-group rg-tournament-trail \
            --name vm-tournament-trail \
            --query name \
            --output tsv
          

      - name: Test Azure VM Run Command
        run: |
          az vm run-command invoke \
            --resource-group rg-tournament-trail \
            --name vm-tournament-trail \
            --command-id RunShellScript \
            --scripts 'set -eu; hostname; whoami; test -f /home/azureuser/tournament-trail/compose.azure.yaml; echo "VM command OK"' \
            --query "value[].message" \
            --output tsv

