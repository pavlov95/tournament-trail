about.page.title=About | TournamentTrail

about.hero.eyebrow=About TournamentTrail
about.hero.title=Helping chess players compete beyond their home city.
about.hero.description=TournamentTrail brings tournament discovery, registration, travel coordination, and organiser tools into one platform.

about.summary.discover.title=Discover
about.summary.discover.text=Find upcoming chess tournaments.
about.summary.compete.title=Compete
about.summary.compete.text=Register and track participation details.
about.summary.travel.title=Travel
about.summary.travel.text=Coordinate journeys with other players.

about.idea.eyebrow=The idea
about.idea.title=Why TournamentTrail exists

about.problem.title=The problem
about.problem.paragraph1=Chess tournaments are often published across different websites, social media pages, and local communities. Players may need to search through multiple sources before finding the event details they need.
about.problem.paragraph2=Travelling to another city can also be expensive and difficult to organise, especially when players do not know who else is attending from their area.

about.solution.title=The solution
about.solution.paragraph1=TournamentTrail provides one place where players can browse events, review participation requirements, register for tournaments, and track their status through My registrations.
about.solution.paragraph2=Players can also create or join travel groups connected to a specific tournament and coordinate the journey with other participants.

about.features.eyebrow=Platform features
about.features.title=What users can do

about.feature.browse.title=Browse tournaments
about.feature.browse.text=Search by location, date, time control, entry fee, and tournament status.
about.feature.registrations.title=Manage registrations
about.feature.registrations.text=Register for tournaments and follow registration and payment progress.
about.feature.travel.title=Organise shared travel
about.feature.travel.text=Create travel groups, review join requests, and coordinate with accepted members.
about.feature.publish.title=Publish events
about.feature.publish.text=Approved organisers can create tournaments and manage participants.
about.feature.costs.title=Track travel costs
about.feature.costs.text=Group members can record expected and actual travel expenses.
about.feature.trust.title=Build trust
about.feature.trust.text=Reviews, organiser approval, and clear event details support informed decisions.

about.goal.eyebrow=Our goal
about.goal.title=Make tournament participation easier from discovery to arrival.
about.goal.text=TournamentTrail reduces the organisational work around chess events, so players can focus more on preparation and competition.

contact.page.title=Contact and FAQ | TournamentTrail

contact.hero.eyebrow=Help and contact
contact.hero.title=Frequently asked questions
contact.hero.description=Find answers about tournament registration, travel groups, organiser permissions, payments, and rated chess events.

contact.card.eyebrow=Further questions
contact.card.title=Contact TournamentTrail
contact.card.text=If your question is not answered below, send an email to:
contact.card.note=TournamentTrail can help with platform-related issues. Tournament rules, refunds, disputes, and title requirements may also require contacting the tournament organiser or the relevant chess federation.

contact.faq.eyebrow=FAQ
contact.faq.title=Using TournamentTrail

contact.faq.browse.question=Do I need an account to browse tournaments?
contact.faq.browse.answer=No. Public tournaments can be viewed without an account. You need to create an account and log in before registering for a tournament, joining a travel group, or using private features.

contact.faq.register.question=How do I register for a tournament?
contact.faq.register.answer=Open the tournament details page and select Register for tournament. You must be logged in and meet any requirements listed by the organiser. Your registration and payment status will then appear under My registrations.

contact.faq.my-registrations.question=Where can I see my tournament registrations?
contact.faq.my-registrations.answer=Log in and open My registrations from the navigation menu. There you can view registration status, payment status, reservation deadlines, cancellations, and hidden registrations.

contact.faq.travel-group.question=How do I join a travel group?
contact.faq.travel-group.answer=Open a tournament and view its available travel groups. Select a group, review its public details, and submit a join request. The group owner decides whether to approve or reject the request.

contact.faq.organiser.question=Who can create tournaments?
contact.faq.organiser.answer=Only approved organisers and administrators can create tournaments. A regular player must first submit an organiser application and receive administrator approval.

contact.faq.cancel.question=Can I cancel a tournament registration?
contact.faq.cancel.answer=Cancellation depends on the tournament's rules and current status. If cancellation is enabled, use the option on the tournament or registration page. Refunds are controlled by the organiser's policy and are not automatically guaranteed by TournamentTrail.

contact.faq.payment.question=How is my payment status confirmed?
contact.faq.payment.answer=Payment is made according to the organiser's instructions. The organiser reviews the payment information and updates your status. TournamentTrail displays that status but does not process the payment unless a payment service is added in the future.

contact.support.eyebrow=Still need help?
contact.support.title=Send us your question
contact.support.text=Include your username, the tournament or travel-group name, and a clear description of the issue. Do not send passwords, card details, or other sensitive payment information.
contact.support.email-button=Email support

