about.page.title=За нас | TournamentTrail

about.hero.eyebrow=За TournamentTrail
about.hero.title=Помагаме на шахматистите да участват в турнири извън своя град.
about.hero.description=TournamentTrail събира откриване на турнири, регистрация, координация на пътуване и инструменти за организатори в една платформа.

about.summary.discover.title=Откривай
about.summary.discover.text=Намирай предстоящи шахматни турнири.
about.summary.compete.title=Състезавай се
about.summary.compete.text=Регистрирай се и следи детайлите за участието си.
about.summary.travel.title=Пътувай
about.summary.travel.text=Координирай пътувания с други играчи.

about.idea.eyebrow=Идеята
about.idea.title=Защо съществува TournamentTrail

about.problem.title=Проблемът
about.problem.paragraph1=Шахматните турнири често се публикуват в различни сайтове, социални мрежи и местни общности. Играчите понякога трябва да търсят в много източници, преди да намерят нужната информация.
about.problem.paragraph2=Пътуването до друг град също може да бъде скъпо и трудно за организиране, особено когато играчите не знаят кой друг ще присъства от техния район.

about.solution.title=Решението
about.solution.paragraph1=TournamentTrail предоставя едно място, където играчите могат да разглеждат събития, да проверяват изискванията за участие, да се регистрират за турнири и да следят статуса си в Моите регистрации.
about.solution.paragraph2=Играчите могат също да създават или да се присъединяват към групи за пътуване, свързани с конкретен турнир, и да координират пътуването с други участници.

about.features.eyebrow=Функции на платформата
about.features.title=Какво могат да правят потребителите

about.feature.browse.title=Разглеждане на турнири
about.feature.browse.text=Търсене по локация, дата, времева контрола, такса за участие и статус на турнира.
about.feature.registrations.title=Управление на регистрации
about.feature.registrations.text=Регистрация за турнири и проследяване на регистрационния и платежния статус.
about.feature.travel.title=Организиране на споделено пътуване
about.feature.travel.text=Създаване на групи за пътуване, преглед на заявки и координация с приетите членове.
about.feature.publish.title=Публикуване на събития
about.feature.publish.text=Одобрените организатори могат да създават турнири и да управляват участници.
about.feature.costs.title=Проследяване на разходи
about.feature.costs.text=Членовете на групата могат да записват очаквани и реални разходи за пътуване.
about.feature.trust.title=Изграждане на доверие
about.feature.trust.text=Ревюта, одобрение на организатори и ясни детайли за събитията подпомагат информираните решения.

about.goal.eyebrow=Нашата цел
about.goal.title=Да направим участието в турнири по-лесно от откриването до пристигането.
about.goal.text=TournamentTrail намалява организационната работа около шахматните събития, за да могат играчите да се фокусират повече върху подготовката и състезанието.

about.action.browse-tournaments=Разгледай турнири
about.action.open-dashboard=Отвори таблото

contact.page.title=Контакти и ЧЗВ | TournamentTrail

contact.hero.eyebrow=Помощ и контакти
contact.hero.title=Често задавани въпроси
contact.hero.description=Намерете отговори за регистрация за турнири, групи за пътуване, права на организатори, плащания и рейтингови шахматни събития.

contact.card.eyebrow=Допълнителни въпроси
contact.card.title=Свържете се с TournamentTrail
contact.card.text=Ако въпросът ви не е отговорен по-долу, изпратете имейл до:
contact.card.note=TournamentTrail може да помогне с проблеми, свързани с платформата. Правила на турнира, възстановяване на суми, спорове и изисквания за титли може да изискват контакт с организатора на турнира или съответната шахматна федерация.

contact.faq.eyebrow=ЧЗВ
contact.faq.title=Използване на TournamentTrail

contact.faq.browse.question=Трябва ли ми акаунт, за да разглеждам турнири?
contact.faq.browse.answer=Не. Публичните турнири могат да се разглеждат без акаунт. Нужно е да създадете акаунт и да влезете, преди да се регистрирате за турнир, да се присъедините към група за пътуване или да използвате частни функции.

contact.faq.register.question=Как да се регистрирам за турнир?
contact.faq.register.answer=Отворете страницата с детайли за турнира и изберете Регистрация за турнир. Трябва да сте влезли в акаунта си и да покривате изискванията, посочени от организатора. Регистрацията и платежният ви статус ще се виждат в Моите регистрации.

contact.faq.my-registrations.question=Къде мога да видя регистрациите си за турнири?
contact.faq.my-registrations.answer=Влезте в акаунта си и отворете Моите регистрации от навигационното меню. Там можете да видите регистрационен статус, платежен статус, срокове за резервация, анулации и скрити регистрации.

contact.faq.travel-group.question=Как да се присъединя към група за пътуване?
contact.faq.travel-group.answer=Отворете турнир и разгледайте наличните групи за пътуване. Изберете група, прегледайте публичните детайли и изпратете заявка за присъединяване. Собственикът на групата решава дали да одобри или отхвърли заявката.

contact.faq.organiser.question=Кой може да създава турнири?
contact.faq.organiser.answer=Само одобрени организатори и администратори могат да създават турнири. Обикновеният играч първо трябва да изпрати заявка за организатор и да получи одобрение от администратор.

contact.faq.cancel.question=Мога ли да отменя регистрация за турнир?
contact.faq.cancel.answer=Отмяната зависи от правилата и текущия статус на турнира. Ако отмяната е разрешена, използвайте опцията на страницата на турнира или регистрацията. Възстановяването на суми се определя от политиката на организатора и не е автоматично гарантирано от TournamentTrail.

contact.faq.payment.question=Как се потвърждава платежният ми статус?
contact.faq.payment.answer=Плащането се извършва според инструкциите на организатора. Организаторът преглежда платежната информация и обновява статуса ви. TournamentTrail показва този статус, но не обработва плащането, освен ако в бъдеще не бъде добавена платежна услуга.

contact.support.eyebrow=Все още имате нужда от помощ?
contact.support.title=Изпратете ни въпроса си
contact.support.text=Включете потребителското си име, името на турнира или групата за пътуване и ясно описание на проблема. Не изпращайте пароли, данни за карти или друга чувствителна платежна информация.
contact.support.email-button=Имейл до поддръжката

