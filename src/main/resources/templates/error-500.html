<!DOCTYPE html>
<html lang="en"
      th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="#{error500.page.title}">Server Error | TournamentTrail</title>

    <link rel="stylesheet" th:href="@{/css/error-500.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>

<body>

<div th:replace="~{fragments/header :: siteHeader(false)}"></div>
<main class="error-shell">

    <section class="error-card">

        <p class="eyebrow" th:text="#{error500.eyebrow}">Server error</p>

        <div class="error-code">500</div>

        <h1 th:text="#{error500.title}">Something went wrong on our side.</h1>

        <p class="error-message"
           th:text="${message != null ? message : #messages.msg('error500.default-message')}">
            An unexpected error occurred.
        </p>

        <div class="error-details" th:if="${path != null}">
            <span th:text="#{error.requested-path}">Requested path</span>
            <strong th:text="${path}">/example/path</strong>
        </div>

        <p class="helper-text" th:text="#{error500.helper-text}">
            The request reached TournamentTrail, but the server could not complete it.
            You can return to a safe page and try again.
        </p>

        <div class="error-actions">
            <a class="button button-primary"
               th:text="#{error.action.home}"
               th:href="@{/}">Go to home</a>

            <a class="button button-secondary"
               th:text="#{error.action.browse-tournaments}"
               th:href="@{/tournaments}">Browse tournaments</a>
        </div>

    </section>

</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>

</body>
</html>
