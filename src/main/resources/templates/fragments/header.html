
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header class="site-header" th:fragment="siteHeader(isHome, activePage)">
    <nav class="navbar">

        <a class="brand" th:href="@{/}">TournamentTrail</a>



        <div class="nav-links">

            <a th:href="@{/tournaments}"
               th:classappend="${activePage == 'tournaments'} ? 'active'"
               th:text="#{nav.tournaments}">Tournaments</a>

            <a th:href="@{/registrations}"
               th:classappend="${activePage == 'registrations'} ? 'active'"
               th:text="#{nav.registrations}">My registrations</a>

            <a th:href="@{/travel-groups}"
               th:classappend="${activePage == 'travel-groups'} ? 'active'"
               th:text="#{nav.travel-groups}">Travel groups</a>

            <a th:href="@{/about}"
               th:classappend="${activePage == 'about'} ? 'active'"
               th:text="#{nav.about}">About</a>

            <a th:href="@{/contact}"
               th:classappend="${activePage == 'contact'} ? 'active'"
               th:text="#{nav.contact}">Contact</a>

        </div>



        <div class="nav-actions"
             sec:authorize="isAnonymous()">

            <a class="button button-secondary secondary-button"
               th:href="@{/login}"
               th:text="#{nav.login}">Login</a>

            <a class="button button-primary primary-button"
               th:href="@{/register}"
               th:text="#{nav.create-account}">Create account</a>
        </div>

        <div class="nav-actions"
             sec:authorize="isAuthenticated()">

            <a class="button button-primary primary-button"
               th:href="${isHome} ? @{/profile/edit} : @{/home}"
               th:text="${isHome} ? #{nav.edit-profile} : #{nav.dashboard}">
                Dashboard
            </a>

            <form th:action="@{/logout}" method="post">
                <button class="button button-secondary secondary-button logout-button"
                        type="submit"
                        th:text="#{nav.logout}">Logout</button>
            </form>
        </div>

        <div class="language-switcher">
            <a th:href="@{/login(lang='en')}"
               th:text="#{language.english}">English</a>
            <span>|</span>
            <a th:href="@{/login(lang='bg')}"
               th:text="#{language.bulgarian}">Bulgarian</a>
        </div>
    </nav>
</header>

</body>
</html>
