<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{error400.page.title}">400 | TournamentTrail</title>
    <link rel="stylesheet" th:href="@{/css/error-400.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader(false)}"></div>
<main class="error-shell">

    <section class="error-card">
        <div class="error-badge">400</div>

        <p class="eyebrow" th:text="#{error400.eyebrow}">Invalid request</p>

        <h1 th:text="#{error400.title}">This action cannot be completed.</h1>

        <p class="error-message"
           th:text="${message != null ? message : #messages.msg('error400.default-message')}">
            The request was invalid or the action is not allowed in the current state.
        </p>

        <p class="error-path" th:if="${path != null}">
            <span th:text="#{error.requested-path}">Requested path:</span>
            <span th:text="${path}">/example</span>
        </p>

        <div class="error-actions">
            <a class="button button-primary"
               th:href="@{/tournaments}"
               th:text="#{error.action.browse-tournaments}">
                Browse tournaments
            </a>

            <a class="button button-secondary"
               th:href="@{/home}"
               th:text="#{error.action.dashboard}">
                Go to dashboard
            </a>

            <a class="button button-secondary"
               th:href="@{/}"
               th:text="#{error.action.homepage}">
                Back to homepage
            </a>
        </div>
    </section>

</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
